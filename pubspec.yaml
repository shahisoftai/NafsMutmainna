name: nafsmutmainna
description: "Privacy-first spiritual self-improvement app"
publish_to: 'none'
version: 1.1.18+21

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  go_router: ^14.0.0
  flutter_screenutil: ^5.9.0
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  table_calendar: ^3.1.0

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Data & Serialization
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.4.0
  supabase_flutter: ^2.5.0
  connectivity_plus: ^6.0.0

  # Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.0

  # Storage & Security
  flutter_secure_storage: ^9.2.0
  path_provider: ^2.1.0
  local_auth: ^2.3.0

  # Local DB
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: ^1.1.1
  path: ^1.9.0

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.5
  crypto: ^3.0.3
  uuid: ^4.4.0
  retry: ^3.1.0
  dartz: ^0.10.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  hive_generator: ^2.0.0
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
    - assets/images/
